<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
    <title>ProcoZone · ZoFranca CR — Gestión de Zonas Francas</title>
    <script>
      /* Aplica tema e idioma antes del primer paint para evitar parpadeo */
      (function () {
        try {
          var stored = localStorage.getItem('procozone_theme');
          var dark = stored === 'dark' || (!stored && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          document.documentElement.lang = localStorage.getItem('procozone_language') === 'en' ? 'en' : 'es';
        } catch (e) { /* almacenamiento no disponible */ }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div id="toast-container"></div>
    <div id="modal-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js" type="text/javascript"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
